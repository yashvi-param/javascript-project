<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - JavaScript Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="#">ShopEase</a>
      <button id="cartBtn" class="cart-btn">Cart <span id="cartCount">0</span></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">JAVASCRIPT PROJECT</p>
        <h1>Simple Shopping Cart</h1>
        <p>Browse products, add items to your cart, change quantities and keep your cart saved with localStorage.</p>
      </div>
    </section>

    <section class="container products-section">
      <div class="section-head">
        <div>
          <p class="eyebrow">OUR PRODUCTS</p>
          <h2>Featured Products</h2>
        </div>
        <input id="searchInput" type="search" placeholder="Search products...">
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="cartOverlay" class="overlay hidden"></div>
  <aside id="cartPanel" class="cart-panel">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="closeCart" class="icon-btn" aria-label="Close cart">&times;</button>
    </div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
      <button id="clearCartBtn" class="clear-btn">Clear Cart</button>
    </div>
  </aside>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
